<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #666666;
      font-size: 14px;
    }

    .card {
      border: 1px solid #dddddd;
      border-radius: 14px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #cccccc;
      background: #ffffff;
      color: #111111;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111111;
    }

    .submit-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      display: block;
      background: #eef8f0;
      color: #176b2c;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a00000;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <h1>ZYRE MARKETING</h1>
      <p>Your business. Your store. One marketplace.</p>
    </div>

    <section class="card">

      <div class="tabs">
        <button
          type="button"
          class="tab active"
          id="loginTab"
        >
          Login
        </button>

        <button
          type="button"
          class="tab"
          id="registerTab"
        >
          Create Account
        </button>
      </div>

      <!-- LOGIN -->

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>

          <input
            type="email"
            id="loginEmail"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="submit-button"
          id="loginButton"
        >
          Login
        </button>

      </form>

      <!-- REGISTER -->

      <form
        id="registerForm"
        class="hidden"
      >

        <div class="form-group">
          <label for="registerName">Full Name</label>

          <input
            type="text"
            id="registerName"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>

          <input
            type="email"
            id="registerEmail"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>

          <input
            type="password"
            id="registerPassword"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="submit-button"
          id="registerButton"
        >
          Create Account
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

    </section>

    <a
      href="index.html"
      class="back"
    >
      ← Back to ZYRE MARKETING
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ouidmklcvdqmjofxfyhu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const loginButton =
      document.getElementById("loginButton");

    const registerButton =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");

      message.className = "message";
      message.textContent = "";
    });

    registerTab.addEventListener("click", () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      message.className = "message";
      message.textContent = "";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      showMessage("Logging in...", "success");

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showMessage(error.message, "error");

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }

      showMessage(
        "Login successful.",
        "success"
      );

      window.location.href = "index.html";
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      registerButton.disabled = true;
      registerButton.textContent = "Creating...";

      showMessage(
        "Creating your account...",
        "success"
      );

      const fullName =
        document.getElementById("registerName").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;

      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

      if (error) {
        showMessage(error.message, "error");

        registerButton.disabled = false;
        registerButton.textContent = "Create Account";

        return;
      }

      if (data.user) {
        showMessage(
          "Account created successfully.",
          "success"
        );

        registerForm.reset();

        registerButton.disabled = false;
        registerButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
