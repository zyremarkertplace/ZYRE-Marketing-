    footer {

  </style>  </head>  <body>    <header>    <nav class="nav">  <a

  readonly    
>

>

></textarea>

  </div>    <button

  </footer>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script>    const SUPABASE_URL =    
  "https://ouidmklcvdqmjofxfyhu.supabase.co";    

const SUPABASE_PUBLISHABLE_KEY =    
  "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";    


const supabaseClient =    
  window.supabase.createClient(    
    SUPABASE_URL,    
    SUPABASE_PUBLISHABLE_KEY    
  );    


const sellerForm =    
  document.getElementById("sellerForm");    

const signedIn =    
  document.getElementById("signedIn");    

const message =    
  document.getElementById("message");    

const submitButton =    
  document.getElementById("submitButton");    


let currentUser = null;    


function showMessage(    
  text,    
  type    
) {    

  message.textContent = text;    

  message.className =    
    "message " + type;    
}    


async function loadUser() {    

  const {    
    data: {    
      user    
    }    
  } =    
    await supabaseClient.auth.getUser();    


  if (!user) {    

    currentUser = null;    

    signedIn.textContent =    
      "You must be logged in to submit a seller application.";    

    sellerForm.style.display =    
      "none";    

    return;    
  }    


  currentUser = user;    


  signedIn.textContent =    
    "Signed in as: " + user.email;    


  document.getElementById("email").value =    
    user.email || "";    


  const {    
    data: profile    
  } =    
    await supabaseClient    
      .from("profiles")    
      .select(    
        "full_name, phone, address"    
      )    
      .eq(    
        "id",    
        user.id    
      )    
      .single();    


  if (profile) {    

    document.getElementById("fullName").value =    
      profile.full_name || "";    

    document.getElementById("phone").value =    
      profile.phone || "";    

    document.getElementById("residentialAddress").value =    
      profile.address || "";    
  }    
}    


sellerForm.addEventListener(    
  "submit",    
  async event => {    

    event.preventDefault();    


    if (!currentUser) {    

      showMessage(    
        "Please log in before submitting your application.",    
        "error"    
      );    

      return;    
    }    


    submitButton.disabled =    
      true;    

    submitButton.textContent =    
      "Submitting...";    


    const application = {    

      user_id:    
        currentUser.id,    

      full_name:    
        document.getElementById("fullName").value.trim(),    

      email:    
        document.getElementById("email").value.trim(),    

      phone:    
        document.getElementById("phone").value.trim(),    

      residential_address:    
        document    
          .getElementById("residentialAddress")    
          .value    
          .trim(),    

      store_address:    
        document    
          .getElementById("storeAddress")    
          .value    
          .trim(),    

      id_number:    
        document    
          .getElementById("idNumber")    
          .value    
          .trim(),    

      store_name:    
        document    
          .getElementById("storeName")    
          .value    
          .trim(),    

      store_category:    
        document    
          .getElementById("storeCategory")    
          .value    
          .trim()    
    };    


    const {    
      error    
    } =    
      await supabaseClient    
        .from("seller_applications")    
        .insert(    
          application    
        );    


    if (error) {    

      console.error(    
        "Seller application error:",    
        error    
      );    

      showMessage(    
        "We couldn't submit your application. Please try again.",    
        "error"    
      );    

      submitButton.disabled =    
        false;    

      submitButton.textContent =    
        "Submit Seller Application";    

      return;    
    }

showMessage(
"Your seller application has been submitted. Please complete the ID document and selfie verification.",
"success"
);

sellerForm.reset();

document.getElementById("email").value =
currentUser.email || "";

submitButton.disabled =
false;

submitButton.textContent =
"Continue Verification";

}
);

loadUser();

  </script> 

 </body>
