<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE Marketing | Seller Orders</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #ccc;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .back-button {
      display: inline-block;
      text-decoration: none;
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .status {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .order-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .order-number {
      font-weight: bold;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .item-info {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .customer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty {
      background: #fff;
      padding: 30px 20px;
      text-align: center;
      border-radius: 12px;
      color: #555;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

<header>
  <h1>ZYRE Marketing</h1>
  <p>Seller Orders</p>
</header>

<main>

  <div class="top-bar">
    <h2>My Orders</h2>

    <a
      href="seller-dashboard.html"
      class="back-button"
    >
      Back to Dashboard
    </a>
  </div>

  <div
    id="status"
    class="status"
  >
    Loading orders...
  </div>

  <div id="orders"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://ouidmklcvdqmjofxfyhu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const statusBox =
    document.getElementById("status");

  const ordersBox =
    document.getElementById("orders");


  async function loadSellerOrders() {

    const {
      data: {
        session
      },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();

    if (sessionError || !session) {
      window.location.href = "auth.html";
      return;
    }

    const user =
      session.user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();


    if (
      profileError ||
      !profile ||
      profile.role !== "seller"
    ) {
      statusBox.textContent =
        "Seller access required.";

      statusBox.classList.add("error");

      return;
    }


    const {
      data: orderItems,
      error: itemsError
    } =
      await supabaseClient
        .from("order_items")
        .select(
          "id, order_id, product_id, product_name, quantity, unit_price, line_total"
        )
        .eq(
          "seller_user_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (itemsError) {

      console.error(itemsError);

      statusBox.textContent =
        "We couldn't load your orders.";

      statusBox.classList.add("error");

      return;
    }


    if (
      !orderItems ||
      orderItems.length === 0
    ) {

      statusBox.textContent =
        "";

      ordersBox.innerHTML = `
        <div class="empty">
          You don't have any orders yet.
        </div>
      `;

      return;
    }


    const orderIds =
      [
        ...new Set(
          orderItems.map(
            item => item.order_id
          )
        )
      ];


    const {
      data: orders,
      error: ordersError
    } =
      await supabaseClient
        .from("orders")
        .select(
          "id, order_number, status, total_amount, currency, shipping_full_name, shipping_phone, shipping_address, payment_status, created_at"
        )
        .in(
          "id",
          orderIds
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (ordersError) {

      console.error(ordersError);

      statusBox.textContent =
        "We couldn't load the order details.";

      statusBox.classList.add("error");

      return;
    }


    statusBox.textContent =
      `${orders.length} order(s) found.`;


    ordersBox.innerHTML = "";


    orders.forEach(order => {

      const items =
        orderItems.filter(
          item =>
            item.order_id === order.id
        );


      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const itemHtml =
        items.map(item => {

          return `
            <div class="item">

              <div class="item-name">
                ${escapeHtml(
                  item.product_name
                )}
              </div>

              <div class="item-info">
                Quantity:
                ${item.quantity}
                <br>

                Price:
                ${formatMoney(
                  item.unit_price,
                  order.currency
                )}

                <br>

                Item total:
                ${formatMoney(
                  item.line_total,
                  order.currency
                )}
              </div>

            </div>
          `;

        }).join("");


      card.innerHTML = `

        <div class="order-header">

          <div>
            <div class="order-number">
              ${escapeHtml(
                order.order_number
              )}
            </div>

            <div class="item-info">
              ${formatDate(
                order.created_at
              )}
            </div>
          </div>

          <div>
            <span class="status-badge">
              ${escapeHtml(
                order.status
              )}
            </span>
          </div>

        </div>


        ${itemHtml}


        <div class="customer">

          <strong>Customer</strong>
          <br>

          Name:
          ${escapeHtml(
            order.shipping_full_name
          )}
          <br>

          Phone:
          ${escapeHtml(
            order.shipping_phone
          )}
          <br>

          Address:
          ${escapeHtml(
            order.shipping_address
          )}

        </div>

      `;


      ordersBox.appendChild(card);

    });

  }


  function formatMoney(
    amount,
    currency
  ) {

    const value =
      Number(amount || 0);

    return new Intl.NumberFormat(
      "en-ZA",
      {
        style: "currency",
        currency:
          currency || "ZAR"
      }
    ).format(value);

  }


  function formatDate(
    date
  ) {

    return new Date(
      date
    ).toLocaleString(
      "en-ZA"
    );

  }


  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  loadSellerOrders();

</script>

</body>
</html>
