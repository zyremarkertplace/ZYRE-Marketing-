<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Checkout</title>

  <meta
    name="description"
    content="Checkout on ZYRE MARKETING."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .account-button {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .message {
      padding: 20px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #555555;
      margin-bottom: 20px;
    }

    .error {
      background: #fff1f1;
      color: #9b0000;
    }

    .checkout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 30px;
      align-items: start;
    }

    .card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cccccc;
      border-radius: 7px;
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
      color: #111111;
      background: #ffffff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #111111;
    }

    .summary {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .summary h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .summary-item-name {
      font-weight: 700;
    }

    .summary-item-price {
      white-space: nowrap;
    }

    .summary-row {
      border-top: 1px solid #e5e5e5;
      padding-top: 15px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 20px;
      font-weight: 800;
    }

    .place-order-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .order-note {
      margin-top: 10px;
      text-align: center;
      color: #777777;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px;
      text-align: center;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header {
        padding: 15px;
      }

      main {
        padding: 25px 15px 50px;
      }

      h1 {
        font-size: 28px;
      }

      .checkout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    ZYRE MARKETING
  </div>

  <a
    id="accountLink"
    class="account-button"
    href="auth.html"
  >
    Login
  </a>

</header>

<main>

  <a
    class="back-link"
    href="cart.html"
  >
    ← Back to Cart
  </a>

  <h1>
    Checkout
  </h1>

  <div
    id="message"
    class="message"
    hidden
  ></div>

  <section
    id="checkoutContent"
    class="checkout"
    hidden
  >

    <div>

      <div class="card">

        <h2>
          Delivery Information
        </h2>

        <div class="field">

          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            type="text"
            autocomplete="name"
            placeholder="Enter your full name"
          >

        </div>

        <div class="field">

          <label for="phone">
            Phone Number
          </label>

          <input
            id="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Enter your phone number"
          >

        </div>

        <div class="field">

          <label for="address">
            Delivery Address
          </label>

          <textarea
            id="address"
            autocomplete="street-address"
            placeholder="Enter your full delivery address"
          ></textarea>

        </div>

      </div>

    </div>

    <aside class="summary">

      <h2>
        Order Summary
      </h2>

      <div id="summaryItems"></div>

      <div class="summary-row">

        <span>
          Total
        </span>

        <span id="summaryTotal">
          R0.00
        </span>

      </div>

      <button
  id="placeOrderButton"
  class="place-order-button"
  type="button"
>
  Place Order
</button>

      <div class="order-note">
        Order creation and payment will be added in the next steps.
      </div>

    </aside>

  </section>

</main>

<footer>
  © 2026 ZYRE MARKETING. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://ouidmklcvdqmjofxfyhu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const accountLink =
    document.getElementById(
      "accountLink"
    );

  const message =
    document.getElementById(
      "message"
    );

  const checkoutContent =
    document.getElementById(
      "checkoutContent"
    );

  const fullName =
    document.getElementById(
      "fullName"
    );

  const phone =
    document.getElementById(
      "phone"
    );

  const address =
    document.getElementById(
      "address"
    );

  const summaryItems =
    document.getElementById(
      "summaryItems"
    );

  const summaryTotal =
    document.getElementById(
      "summaryTotal"
    );


  function getCart() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "zyre_cart"
        ) || "[]"
      );

    } catch (error) {

      console.error(
        "Cart loading error:",
        error
      );

      return [];

    }

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function showMessage(
    text,
    isError = false
  ) {

    message.textContent =
      text;

    message.className =
      isError
        ? "message error"
        : "message";

    message.hidden = false;

  }


  function renderSummary() {

    const cart =
      getCart();

    if (
      cart.length === 0
    ) {

      checkoutContent.hidden = true;

      showMessage(
        "Your cart is empty.",
        false
      );

      return false;

    }

    let total = 0;

    summaryItems.innerHTML = "";

    cart.forEach(
      item => {

        const quantity =
          Number(item.quantity) || 1;

        const price =
          Number(item.price) || 0;

        const itemTotal =
          price * quantity;

        total += itemTotal;

        const itemElement =
          document.createElement(
            "div"
          );

        itemElement.className =
          "summary-item";

        itemElement.innerHTML = `
          <span class="summary-item-name">
            ${escapeHtml(
              item.name
            )} × ${quantity}
          </span>

          <span class="summary-item-price">
            R${itemTotal.toFixed(2)}
          </span>
        `;

        summaryItems.appendChild(
          itemElement
        );

      }
    );

    summaryTotal.textContent =
      `R${total.toFixed(2)}`;

    checkoutContent.hidden = false;

    return true;

  }


  async function loadCustomer() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();

    if (!session) {

      accountLink.href =
        "auth.html";

      accountLink.textContent =
        "Login";

      showMessage(
        "Please log in to continue to checkout.",
        true
      );

      checkoutContent.hidden = true;

      return false;

    }

    accountLink.href =
      "account.html";

    accountLink.textContent =
      "My Account";


    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "full_name, phone"
        )
        .eq(
          "id",
          session.user.id
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Profile loading error:",
        error
      );

    }


    if (profile) {

      fullName.value =
        profile.full_name ||
        "";

      phone.value =
        profile.phone ||
        "";

    }

    return true;

  }


  async function init() {

    const cartExists =
      renderSummary();

    if (!cartExists) {
      return;
    }

    await loadCustomer();

  }


  init();

</script>

</body>
</html>
