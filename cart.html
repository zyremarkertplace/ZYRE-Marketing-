<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Cart</title>

  <meta
    name="description"
    content="View your shopping cart on ZYRE MARKETING."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .account-button {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .message {
      padding: 20px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #555555;
    }

    .cart {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 30px;
      align-items: start;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cart-item {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .item-image {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      background: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      font-size: 12px;
      text-align: center;
      overflow: hidden;
    }

    .item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .item-price {
      font-size: 15px;
      color: #555555;
      margin-bottom: 10px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      border: 1px solid #cccccc;
      background: #ffffff;
      color: #111111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-number {
      min-width: 25px;
      text-align: center;
      font-weight: 700;
    }

    .item-total {
      text-align: right;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .remove-button {
      border: 0;
      background: none;
      color: #9b0000;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .summary {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .summary h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
      color: #555555;
    }

    .summary-total {
      border-top: 1px solid #e5e5e5;
      padding-top: 15px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
    }

    .checkout-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.5;
    }

    .checkout-note {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      color: #777777;
      text-align: center;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px;
      text-align: center;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header {
        padding: 15px;
      }

      main {
        padding: 25px 15px 50px;
      }

      h1 {
        font-size: 28px;
      }

      .cart {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

      .cart-item {
        grid-template-columns: 75px 1fr;
        gap: 12px;
      }

      .item-image {
        width: 75px;
        height: 75px;
      }

      .item-actions {
        grid-column: 2;
      }

      .item-total {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    ZYRE MARKETING
  </div>

  <a
    id="accountLink"
    class="account-button"
    href="auth.html"
  >
    Login
  </a>

</header>

<main>

  <a
    class="back-link"
    href="index.html"
  >
    ← Back to Marketplace
  </a>

  <h1>
    Your Cart
  </h1>

  <div
    id="emptyMessage"
    class="message"
    hidden
  >
    Your cart is empty.
  </div>

  <section
    id="cartContent"
    class="cart"
    hidden
  >

    <div
      id="cartItems"
      class="cart-items"
    ></div>

    <aside class="summary">

      <h2>
        Order Summary
      </h2>

      <div class="summary-row">
        <span>
          Items
        </span>

        <span id="itemCount">
          0
        </span>
      </div>

      <div class="summary-total">
        <span>
          Total
        </span>

        <span id="cartTotal">
          R0.00
        </span>
      </div>

      <a
  class="checkout-button"
  href="checkout.html"
>
  Checkout
</a>

      <div class="checkout-note">
        Checkout will be available in the next step.
      </div>

    </aside>

  </section>

</main>

<footer>
  © 2026 ZYRE MARKETING. All rights reserved.
</footer>

<script>

  const accountLink =
    document.getElementById(
      "accountLink"
    );

  const emptyMessage =
    document.getElementById(
      "emptyMessage"
    );

  const cartContent =
    document.getElementById(
      "cartContent"
    );

  const cartItems =
    document.getElementById(
      "cartItems"
    );

  const itemCount =
    document.getElementById(
      "itemCount"
    );

  const cartTotal =
    document.getElementById(
      "cartTotal"
    );


  function getCart() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "zyre_cart"
        ) || "[]"
      );

    } catch (error) {

      console.error(
        "Cart loading error:",
        error
      );

      return [];

    }

  }


  function saveCart(cart) {

    localStorage.setItem(
      "zyre_cart",
      JSON.stringify(cart)
    );

  }


  function renderCart() {

    const cart =
      getCart();

    cartItems.innerHTML = "";

    if (
      cart.length === 0
    ) {

      cartContent.hidden = true;

      emptyMessage.hidden = false;

      itemCount.textContent = "0";

      cartTotal.textContent =
        "R0.00";

      return;

    }

    emptyMessage.hidden = true;

    cartContent.hidden = false;

    let total = 0;

    let quantityTotal = 0;

    cart.forEach(
      (item, index) => {

        const quantity =
          Number(item.quantity) || 1;

        const price =
          Number(item.price) || 0;

        const itemTotal =
          price * quantity;

        total += itemTotal;

        quantityTotal += quantity;

        const article =
          document.createElement(
            "article"
          );

        article.className =
          "cart-item";

        let imageHTML =
          `<div class="item-image">Product image</div>`;

        if (item.image_url) {

          imageHTML = `
            <div class="item-image">
              <img
                src="${escapeHtml(
                  item.image_url
                )}"
                alt="${escapeHtml(
                  item.name
                )}"
              >
            </div>
          `;

        }

        article.innerHTML = `

          ${imageHTML}

          <div>

            <div class="item-name">
              ${escapeHtml(
                item.name
              )}
            </div>

            <div class="item-price">
              R${price.toFixed(2)}
            </div>

            <div class="quantity">

              <button
                type="button"
                data-action="decrease"
                data-index="${index}"
              >
                −
              </button>

              <span
                class="quantity-number"
              >
                ${quantity}
              </span>

              <button
                type="button"
                data-action="increase"
                data-index="${index}"
              >
                +
              </button>

            </div>

          </div>

          <div class="item-actions">

            <div class="item-total">
              R${itemTotal.toFixed(2)}
            </div>

            <button
              type="button"
              class="remove-button"
              data-action="remove"
              data-index="${index}"
            >
              Remove
            </button>

          </div>

        `;

        cartItems.appendChild(
          article
        );

      }
    );

    itemCount.textContent =
      quantityTotal;

    cartTotal.textContent =
      `R${total.toFixed(2)}`;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  cartItems.addEventListener(
    "click",
    function(event) {

      const button =
        event.target.closest(
          "button"
        );

      if (!button) {
        return;
      }

      const action =
        button.dataset.action;

      const index =
        Number(
          button.dataset.index
        );

      const cart =
        getCart();

      if (
        !cart[index]
      ) {
        return;
      }

      if (
        action ===
        "increase"
      ) {

        cart[index].quantity += 1;

      }

      if (
        action ===
        "decrease"
      ) {

        cart[index].quantity -= 1;

        if (
          cart[index].quantity <= 0
        ) {

          cart.splice(
            index,
            1
          );

        }

      }

      if (
        action ===
        "remove"
      ) {

        cart.splice(
          index,
          1
        );

      }

      saveCart(cart);

      renderCart();

    }
  );


  async function updateAccountLink() {

    const script =
      document.createElement(
        "script"
      );

    script.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    script.onload =
      async function() {

        const SUPABASE_URL =
          "https://ouidmklcvdqmjofxfyhu.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
          "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

        const supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();

        if (session) {

          accountLink.href =
            "account.html";

          accountLink.textContent =
            "My Account";

        } else {

          accountLink.href =
            "auth.html";

          accountLink.textContent =
            "Login";

        }

      };

    document.head.appendChild(
      script
    );

  }


  renderCart();

  updateAccountLink();

</script>

</body>
</html>
