<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Order Details</title>

  <meta
    name="description"
    content="View your ZYRE MARKETING order details."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .account-button {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .message {
      padding: 20px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #555555;
      margin-bottom: 20px;
    }

    .error {
      background: #fff1f1;
      color: #9b0000;
    }

    .card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .order-number {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .order-date {
      color: #777777;
      font-size: 13px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 6px;
      background: #f3f3f3;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #777777;
    }

    .detail-value {
      font-weight: 700;
      text-align: right;
    }

    .item {
      padding: 15px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .item-name {
      font-weight: 800;
    }

    .item-price {
      white-space: nowrap;
      font-weight: 700;
    }

    .item-info {
      margin-top: 6px;
      color: #777777;
      font-size: 13px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 18px;
      margin-top: 15px;
      border-top: 1px solid #e5e5e5;
      font-size: 20px;
      font-weight: 800;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px;
      text-align: center;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      header {
        padding: 15px;
      }

      main {
        padding: 25px 15px 50px;
      }

      h1 {
        font-size: 28px;
      }

      .order-header {
        flex-direction: column;
      }

      .detail-row,
      .item-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    ZYRE MARKETING
  </div>

  <a
    id="accountLink"
    class="account-button"
    href="auth.html"
  >
    Login
  </a>

</header>

<main>

  <a
    class="back-link"
    href="orders.html"
  >
    ← My Orders
  </a>

  <h1>
    Order Details
  </h1>

  <div
    id="message"
    class="message"
    hidden
  ></div>

  <div id="orderContent" hidden>

    <div class="card">

      <div class="order-header">

        <div>

          <div
            id="orderNumber"
            class="order-number"
          ></div>

          <div
            id="orderDate"
            class="order-date"
          ></div>

        </div>

        <div
          id="orderStatus"
          class="status"
        ></div>

      </div>

      <div class="detail-row">

        <span class="detail-label">
          Payment
        </span>

        <span
          id="paymentStatus"
          class="detail-value"
        ></span>

      </div>

    </div>


    <div class="card">

      <h2>
        Items
      </h2>

      <div id="itemsContainer"></div>

    </div>


    <div class="card">

      <h2>
        Delivery Information
      </h2>

      <div class="detail-row">

        <span class="detail-label">
          Full Name
        </span>

        <span
          id="shippingName"
          class="detail-value"
        ></span>

      </div>

      <div class="detail-row">

        <span class="detail-label">
          Phone
        </span>

        <span
          id="shippingPhone"
          class="detail-value"
        ></span>

      </div>

      <div class="detail-row">

        <span class="detail-label">
          Address
        </span>

        <span
          id="shippingAddress"
          class="detail-value"
        ></span>

      </div>

    </div>


    <div class="card">

      <h2>
        Order Summary
      </h2>

      <div class="detail-row">

        <span class="detail-label">
          Subtotal
        </span>

        <span
          id="subtotal"
          class="detail-value"
        ></span>

      </div>

      <div class="detail-row">

        <span class="detail-label">
          Delivery
        </span>

        <span
          id="deliveryFee"
          class="detail-value"
        ></span>

      </div>

      <div class="total-row">

        <span>
          Total
        </span>

        <span id="totalAmount"></span>

      </div>

    </div>

  </div>

</main>

<footer>
  © 2026 ZYRE MARKETING. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://ouidmklcvdqmjofxfyhu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const accountLink =
    document.getElementById(
      "accountLink"
    );

  const message =
    document.getElementById(
      "message"
    );

  const orderContent =
    document.getElementById(
      "orderContent"
    );

  const orderNumber =
    document.getElementById(
      "orderNumber"
    );

  const orderDate =
    document.getElementById(
      "orderDate"
    );

  const orderStatus =
    document.getElementById(
      "orderStatus"
    );

  const paymentStatus =
    document.getElementById(
      "paymentStatus"
    );

  const itemsContainer =
    document.getElementById(
      "itemsContainer"
    );

  const shippingName =
    document.getElementById(
      "shippingName"
    );

  const shippingPhone =
    document.getElementById(
      "shippingPhone"
    );

  const shippingAddress =
    document.getElementById(
      "shippingAddress"
    );

  const subtotal =
    document.getElementById(
      "subtotal"
    );

  const deliveryFee =
    document.getElementById(
      "deliveryFee"
    );

  const totalAmount =
    document.getElementById(
      "totalAmount"
    );


  function showMessage(
    text,
    isError = false
  ) {

    message.textContent =
      text;

    message.className =
      isError
        ? "message error"
        : "message";

    message.hidden = false;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function formatDate(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return date.toLocaleString();

  }


  function formatMoney(value) {

    return `R${Number(
      value || 0
    ).toFixed(2)}`;

  }


  async function loadOrder() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const orderId =
      params.get("id");


    if (!orderId) {

      showMessage(
        "Order ID is missing.",
        true
      );

      return;

    }


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      accountLink.href =
        "auth.html";

      accountLink.textContent =
        "Login";

      showMessage(
        "Please log in to view this order.",
        true
      );

      return;

    }


    accountLink.href =
      "account.html";

    accountLink.textContent =
      "My Account";


    const {
      data: order,
      error: orderError
    } =
      await supabaseClient
        .from("orders")
        .select(
          `
            id,
            order_number,
            status,
            subtotal,
            delivery_fee,
            total_amount,
            currency,
            payment_status,
            shipping_full_name,
            shipping_phone,
            shipping_address,
            created_at
          `
        )
        .eq(
          "id",
          orderId
        )
        .eq(
          "customer_user_id",
          session.user.id
        )
        .maybeSingle();


    if (orderError) {

      console.error(
        "Order loading error:",
        orderError
      );

      showMessage(
        "Order could not be loaded: " +
        orderError.message,
        true
      );

      return;

    }


    if (!order) {

      showMessage(
        "Order not found.",
        true
      );

      return;

    }


    const {
      data: items,
      error: itemsError
    } =
      await supabaseClient
        .from("order_items")
        .select(
          `
            product_name,
            quantity,
            unit_price,
            line_total
          `
        )
        .eq(
          "order_id",
          order.id
        );


    if (itemsError) {

      console.error(
        "Order items loading error:",
        itemsError
      );

      showMessage(
        "Order items could not be loaded: " +
        itemsError.message,
        true
      );

      return;

    }


    orderNumber.textContent =
      order.order_number;

    orderDate.textContent =
      formatDate(
        order.created_at
      );

    orderStatus.textContent =
      order.status;

    paymentStatus.textContent =
      order.payment_status;


    shippingName.textContent =
      order.shipping_full_name ||
      "";

    shippingPhone.textContent =
      order.shipping_phone ||
      "";

    shippingAddress.textContent =
      order.shipping_address ||
      "";


    subtotal.textContent =
      formatMoney(
        order.subtotal
      );

    deliveryFee.textContent =
      formatMoney(
        order.delivery_fee
      );

    totalAmount.textContent =
      formatMoney(
        order.total_amount
      );


    itemsContainer.innerHTML =
      "";


    if (
      !items ||
      items.length === 0
    ) {

      itemsContainer.innerHTML = `
        <div class="message">
          No order items found.
        </div>
      `;

    } else {

      items.forEach(
        item => {

          const itemElement =
            document.createElement(
              "div"
            );

          itemElement.className =
            "item";

          itemElement.innerHTML = `

            <div class="item-top">

              <span class="item-name">
                ${escapeHtml(
                  item.product_name
                )}
              </span>

              <span class="item-price">
                ${formatMoney(
                  item.line_total
                )}
              </span>

            </div>

            <div class="item-info">
              Quantity:
              ${Number(
                item.quantity
              )}

              ·

              Unit price:
              ${formatMoney(
                item.unit_price
              )}
            </div>

          `;

          itemsContainer.appendChild(
            itemElement
          );

        }
      );

    }


    orderContent.hidden =
      false;

  }


  loadOrder();

</script>

</body>
</html>
