<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Store</title>

  <meta
    name="description"
    content="Shop products from independent businesses on ZYRE MARKETING."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .account-button {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .store-header {
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 25px;
      margin-bottom: 30px;
    }

    .store-image {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      background: #f3f3f3;
      display: block;
      margin-bottom: 25px;
    }

    .store-image.placeholder {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .category {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .description {
      color: #555555;
      line-height: 1.6;
      margin: 0;
    }

    .section-title {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }

     .product-card {
  color: inherit;
  text-decoration: none;
  display: block;
}

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f3f3f3;
      display: block;
    }

    .product-image.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
    }

    .product-content {
      padding: 18px;
    }

    .product-name {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .product-description {
      color: #666666;
      font-size: 14px;
      line-height: 1.5;
      min-height: 42px;
      margin: 0 0 15px;
    }

    .product-category {
      color: #666666;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 20px;
      font-weight: 800;
    }

    .product-stock {
      margin-top: 8px;
      font-size: 13px;
      color: #555555;
    }

    .message {
      padding: 20px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #555555;
    }

    .error {
      background: #fff1f1;
      color: #9b0000;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 25px 20px;
      text-align: center;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      main {
        padding: 25px 15px 50px;
      }

      h1 {
        font-size: 28px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">ZYRE MARKETING</div>

  <a
    id="accountLink"
    class="account-button"
    href="auth.html"
  >
    Login
  </a>
</header>

<main>

  <a
    class="back-link"
    href="index.html"
  >
    ← Back to Marketplace
  </a>

  <div id="storeMessage" class="message">
    Loading store...
  </div>

  <section id="storeContent" hidden>

    <div class="store-header">

      <div id="storeImageContainer"></div>

      <h1 id="storeName"></h1>

      <div id="storeCategory" class="category"></div>

      <p
        id="storeDescription"
        class="description"
      ></p>

    </div>

    <section>

      <h2 class="section-title">
        Products
      </h2>

      <div
        id="productsGrid"
        class="products-grid"
      ></div>

    </section>

  </section>

</main>

<footer>
  © 2026 ZYRE MARKETING. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://ouidmklcvdqmjofxfyhu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const storeMessage =
    document.getElementById("storeMessage");

  const storeContent =
    document.getElementById("storeContent");

  const storeImageContainer =
    document.getElementById("storeImageContainer");

  const storeName =
    document.getElementById("storeName");

  const storeCategory =
    document.getElementById("storeCategory");

  const storeDescription =
    document.getElementById("storeDescription");

  const productsGrid =
    document.getElementById("productsGrid");

  const accountLink =
    document.getElementById("accountLink");

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getStoreId() {
    const params = new URLSearchParams(
      window.location.search
    );

    return params.get("id");
  }

  async function updateAccountLink() {
    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      accountLink.href = "account.html";
      accountLink.textContent = "My Account";
    } else {
      accountLink.href = "auth.html";
      accountLink.textContent = "Login";
    }
  }

  function showError(message) {
    storeMessage.textContent = message;
    storeMessage.className = "message error";
    storeMessage.hidden = false;
    storeContent.hidden = true;
  }

  async function loadStore() {

    const storeId = getStoreId();

    if (!storeId) {
      showError("Store not found.");
      return;
    }

    const {
      data: store,
      error: storeError
    } = await supabaseClient
      .from("stores")
      .select(
        "id, name, description, image_url, category, status"
      )
      .eq("id", storeId)
      .eq("status", "active")
      .single();

    if (storeError || !store) {
      console.error(storeError);

      showError(
        "This store could not be found or is not currently available."
      );

      return;
    }

    storeName.textContent = store.name || "Store";

    storeCategory.textContent =
      store.category || "General";

    storeDescription.textContent =
      store.description ||
      "Welcome to our ZYRE MARKETING store.";

    if (store.image_url) {

      storeImageContainer.innerHTML = `
        <img
          class="store-image"
          src="${escapeHtml(store.image_url)}"
          alt="${escapeHtml(store.name)}"
        >
      `;

    } else {

      storeImageContainer.innerHTML = `
        <div class="store-image placeholder">
          Store image
        </div>
      `;

    }

    const {
      data: products,
      error: productsError
    } = await supabaseClient
      .from("products")
      .select(
        "id, name, description, price, image_url, category, stock, status"
      )
      .eq("store_id", store.id)
      .eq("status", "active")
      .order("created_at", {
        ascending: false
      });

    if (productsError) {
      console.error(productsError);

      showError(
        "The store loaded, but its products could not be loaded."
      );

      return;
    }

    if (!products || products.length === 0) {

      productsGrid.innerHTML = `
        <div class="message">
          This store has no products available yet.
        </div>
      `;

    } else {

      productsGrid.innerHTML =
        products.map(product => {

          const stockText =
            Number(product.stock) > 0
              ? `${product.stock} in stock`
              : "Out of stock";

          const imageHtml =
            product.image_url
              ? `
                <img
                  class="product-image"
                  src="${escapeHtml(product.image_url)}"
                  alt="${escapeHtml(product.name)}"
                >
              `
              : `
                <div class="product-image placeholder">
                  Product image
                </div>
              `;

          return `
            <a
  class="product-card"
  href="product.html?id=${encodeURIComponent(product.id)}"
>

              ${imageHtml}

              <div class="product-content">

                <h3 class="product-name">
                  ${escapeHtml(product.name)}
                </h3>

                <p class="product-description">
                  ${escapeHtml(
                    product.description ||
                    "No product description available."
                  )}
                </p>

                <div class="product-category">
                  ${escapeHtml(
                    product.category || "General"
                  )}
                </div>

                <div class="product-price">
                  R${Number(product.price).toFixed(2)}
                </div>

                <div class="product-stock">
                  ${escapeHtml(stockText)}
                </div>

              </div>

            </a>
          `;

        }).join("");
    }

    storeMessage.hidden = true;
    storeContent.hidden = false;
  }

  async function init() {

    await updateAccountLink();

    await loadStore();

  }

  init();
</script>

</body>
</html>
