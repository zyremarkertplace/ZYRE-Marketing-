<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Seller Review</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .message {
      text-align: center;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>ZYRE MARKETING — Seller Review</h1>
</header>

<main>

  <div class="card">

    <div
      id="message"
      class="message"
    >
      Checking owner access...
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ouidmklcvdqmjofxfyhu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_mHt9p0YvJobpp3634d-HA_z7QcoPeO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


async function checkOwnerAccess() {

  const {
  data: {
    session
  },
  error: sessionError
} =
  await supabaseClient.auth.getSession();

if (sessionError) {

  document.getElementById("message").innerHTML =
    "Unable to check your sign-in session.";

  return;
}

if (!session) {

  document.getElementById("message").innerHTML =
    "You must be signed in to access this page.";

  return;
}

const user = session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "Owner access error:",
      error
    );

    document.getElementById("message").innerHTML =
      "Unable to verify owner access.";

    return;
  }


  if (!profile || profile.role !== "admin") {

    document.getElementById("message").innerHTML =
      "Access denied.";

    return;
  }


  document.getElementById("message").innerHTML =
    "Owner access confirmed.";

}


checkOwnerAccess();

</script>

</body>
</html>
