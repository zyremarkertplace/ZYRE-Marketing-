<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE MARKETING | Seller Review</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .message {
      text-align: center;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>ZYRE MARKETING — Seller Review</h1>
</header>

<main>

  <div class="card">

    <div
      id="message"
      class="message"
    >
      Checking owner access...
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>

<script>

const SUPABASE_URL =
  "https://ouidmklcvdqmjofxfyhu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_mHt9p0YvJobpp3634d0-HA_z7QcoPeO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


async function createDocumentUrl(path) {

  if (!path) {
    return null;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from("seller-documents")
      .createSignedUrl(
        path,
        300
      );

  if (error) {

    console.error(
      "Document URL error:",
      error
    );

    return null;
  }

  return data.signedUrl;
}

async function checkOwnerAccess() {

  const {
  data: {
    session
  },
  error: sessionError
} =
  await supabaseClient.auth.getSession();

if (sessionError) {

  document.getElementById("message").innerHTML =
    "Unable to check your sign-in session.";

  return;
}

if (!session) {

  document.getElementById("message").innerHTML =
    "You must be signed in to access this page.";

  return;
}

const user = session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "Owner access error:",
      error
    );

   document.getElementById("message").innerHTML =
  error.message;

    return;
  }


  if (!profile || profile.role !== "admin") {

    document.getElementById("message").innerHTML =
      "Access denied.";

    return;
  }


  document.getElementById("message").innerHTML =
    "Owner access confirmed.";

 const {
  data: applications,
  error: applicationError
} =
  await supabaseClient
    .from("seller_applications")
    .select("*")
    .eq("status", "pending")
    .order("created_at", {
      ascending: true
    });

if (applicationError) {

  console.error(
    "Seller application error:",
    applicationError
  );

  document.getElementById("message").innerHTML =
    applicationError.message;

  return;
}

if (!applications || applications.length === 0) {

  document.getElementById("message").innerHTML =
    "No pending seller applications found.";

  return;
}

document.getElementById("message").innerHTML = `
  <h2>Pending Seller Applications</h2>

  ${(await Promise.all(
  applications.map(async (application) => ({
    application,
    idUrl: await createDocumentUrl(
      application.id_document_path
    ),
    selfieUrl: await createDocumentUrl(
      application.selfie_document_path
    )
  }))
)).map(({ application, idUrl, selfieUrl }, index) => `
    <div style="
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      background: #fafafa;
    ">

      <h3>
        Application ${index + 1}
      </h3>

      <p>
        <strong>Full Name:</strong>
        ${application.full_name || "Not provided"}
      </p>

      <p>
        <strong>Email:</strong>
        ${application.email || "Not provided"}
      </p>

      <p>
        <strong>Phone:</strong>
        ${application.phone || "Not provided"}
      </p>

      <p>
        <strong>Residential Address:</strong>
        ${application.residential_address || "Not provided"}
      </p>

      <p>
        <strong>Store Address:</strong>
        ${application.store_address || "Not provided"}
      </p>

      <p>
        <strong>ID Number:</strong>
        ${application.id_number || "Not provided"}
      </p>

      <p>
        <strong>Store Name:</strong>
        ${application.store_name || "Not provided"}
      </p>

      <p>
        <strong>Store Category:</strong>
        ${application.store_category || "Not provided"}
      </p>

      <p>
        <strong>Status:</strong>
        ${application.status}
      </p>

      <div style="
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
">
  <button
    type="button"
    onclick="approveApplication('${application.id}')"
    style="
      background:#111;
      color:#fff;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    "
  >
    Approve Seller
  </button>

  <button
    type="button"
    onclick="rejectApplication('${application.id}')"
    style="
      background:#fff;
      color:#111;
      border:1px solid #111;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    "
  >
    Reject Seller
  </button>
</div>

     ${
  idUrl
    ? `
      <div style="margin-top:20px;">
        <strong>Government ID</strong>
        <br><br>
        <img
          src="${idUrl}"
          alt="Government ID"
          style="
            width:100%;
            max-width:420px;
            border-radius:12px;
            border:1px solid #ddd;
            display:block;
          "
        >
      </div>
    `
    : `
      <p>
        <strong>Government ID:</strong>
        Document unavailable
      </p>
    `
}

${
  selfieUrl
    ? `
      <div style="margin-top:20px;">
        <strong>Selfie Holding ID</strong>
        <br><br>
        <img
          src="${selfieUrl}"
          alt="Selfie holding ID"
          style="
            width:100%;
            max-width:420px;
            border-radius:12px;
            border:1px solid #ddd;
            display:block;
          "
        >
      </div>
    `
    : `
      <p>
        <strong>Selfie:</strong>
        Document unavailable
      </p>
    `
}

    </div>
  `).join("")}
`;

}


checkOwnerAccess();

</script>

</body>
</html>
